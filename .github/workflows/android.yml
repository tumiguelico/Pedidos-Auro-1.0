name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        run: |
          cd "$(dirname "$(find . -name settings.gradle | head -n 1)")"
          gradle assembleDebug --no-daemon
      - name: Verificar APK
        if: always()
        run: |
          APK=$(find . -path "*build/outputs/apk/debug/app-debug.apk" | head -n 1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          KS=$(find . -name tarifa.keystore | head -n 1)
          {
            echo "## Diagnostico APK"
            echo '```'
            ls -l "$APK"
            "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 || true
            "$BT/aapt2" dump badging "$APK" 2>&1 | head -n 25 || true
            keytool -list -v -keystore "$KS" -storepass tarifa2026 2>&1 | grep -E "Alias|Creation|Entry type|Valid|Signature algorithm|Subject Public Key|Version|Owner" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: TarifaPedidos-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
      - name: Publicar APK (enlace directo)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK=$(find . -path "*build/outputs/apk/debug/app-debug.apk" | head -n 1)
          cp "$APK" TarifaPedidos.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima TarifaPedidos.apk --target "$GITHUB_SHA" --title "Ultima version" --notes "APK compilado automaticamente. Descarga TarifaPedidos.apk desde la tablet e instalalo."
