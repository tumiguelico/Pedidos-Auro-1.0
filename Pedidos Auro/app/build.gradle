plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tarifa.pedidos'
    compileSdk 34

    defaultConfig {
        // Id nuevo: se instala aunque haya otra version vieja firmada con otra clave
        applicationId "com.tarifa.pedidos.auro"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "2.4"
    }

    // Firma fija: asi las versiones nuevas se instalan encima de la anterior
    signingConfigs {
        debug {
            storeFile file('tarifa.keystore')
            storePassword 'tarifa2026'
            keyAlias 'tarifa'
            keyPassword 'tarifa2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
